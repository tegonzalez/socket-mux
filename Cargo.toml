[package]
name = "socket-mux"
version = "0.1.0"
edition = "2021"

[features]
sequence-8 = []
sequence-16 = []

[dependencies]
anyhow = "1"
env_logger = "0.11"
lexopt = "0.3" # SM-D8: choose lexopt for argument parsing.
log = "0.4"
socket2 = "0.6"
crossbeam-queue = "0.3" # lock-free bounded queues for thread hand-off

[target.'cfg(unix)'.dependencies]
# Thread timer slack and nice value (wait policy, low-priority reporter).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
